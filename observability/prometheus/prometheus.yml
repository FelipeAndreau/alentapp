global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alentapp-api'
    static_configs:
      - targets: ['api:3000']
        labels:
          app: 'alentapp'
          service: 'api'

  - job_name: 'opentelemetry'
    static_configs:
      - targets: ['api:9464']
        labels:
          app: 'alentapp'
          service: 'api-otel'
